version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nlreturn
    - revive
    - unconvert
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    wrapcheck:
      ignoreSigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          - wsl_v5
          - nlreturn
      - path: cmd/admin/
        text: "G304|G703|G115"
        linters:
          - gosec
      # Ścieżki plików budowane z serwerowych UUID w obrębie DATA_DIR,
      # nie z danych wejściowych użytkownika.
      - path: internal/handlers/jobs.go
        text: "G304|G703"
        linters:
          - gosec
      # Szablony wiadomości, nie zaszyte poświadczenia.
      - path: internal/mail/templates.go
        text: "G101"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
